envSchema:
  # ---------------------------------------------------------------------------
  # Local-optimized schema (packaged as the "-local" variant).
  # The client port is published on the host; sensible localhost defaults keep
  # local deployment low-friction.
  # ---------------------------------------------------------------------------

  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  # ---------------------------------------------------------------------------
  # External Service Hostnames (local: localhost:port)
  # ---------------------------------------------------------------------------
  - name: GUIDELINE_SERVER_HOSTNAME
    label: Guideline Server Hostname
    description: "Hostname (and port) used to reach the Guideline service API."
    type: text
    required: true
    default: localhost:5008

  - name: ONTOLOGY_SERVER_HOSTNAME
    label: Ontology Server Hostname
    description: "Hostname (and port) used to reach the Ontology service API."
    type: text
    required: true
    default: localhost:5023

  # ---------------------------------------------------------------------------
  # PlatformConfig Client
  # ---------------------------------------------------------------------------
  - name: MOUNT_ROUTE
    label: Mount Route
    description: "URL path at which the PlatformConfig micro-frontend is mounted in the shell."
    type: text
    required: true
    default: /platform-config

  - name: PLATFORMCONFIG_CLIENT_OUTERPORT
    label: PlatformConfig Client Host Port
    description: "Host port on which the PlatformConfig client is published for local access."
    type: text
    required: true
    default: 3133
